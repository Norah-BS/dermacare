<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="form_box">
        <h1>Log In</h1>
        <p>Welcome back to DermaCare</p>

        <form onsubmit="event.preventDefault(); loginUser();">

            <label>Enter your email</label><br>
            <input type="email" id="emailInput"><br><br>

            <label>Enter your password</label><br>
            <input type="password" id="passwordInput"><br><br>

            <button type="button" class="form_btn" onclick="loginUser()">Log In</button>

            <p style="text-align:center; margin-top:15px; font-size:14px;">
                Don’t have an account?
                <a href="signup.html" style="color: var(--P3);">&nbsp; Create one</a>
            </p>

        </form>
    </div>

<script>
function loginUser() {
    const email = document.getElementById("emailInput").value;
    const password_hash = document.getElementById("passwordInput").value;



    fetch("http://localhost:3000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password_hash })
    })
    .then(res => res.json())
    .then(data => {

        console.log("Backend response:", data); // Debug

        if (!data || !data.id) {
            alert("No account found with this information");
            return;
        }

        localStorage.setItem("client_id", data.id);

        window.location.href = "profile.html";
    })
    .catch(err => console.log("Login error:", err));
}
</script>

</body>
</html>
