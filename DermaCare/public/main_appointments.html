<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments</title>
    <link rel="stylesheet" href="css/appointments.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar p2_sec">
        <h2 >DermaCare Appointments</h2>
        <ul class="primary-nav">
            <li><a href="main_appointments.html" class="active">Appointments</a></li>
            <li><a href="add.html">Add</a></li>
            <li><a href="update.html">Update</a></li>
            <li><a href="delete.html">Delete</a></li>
        </ul>
    </nav>

    <div class="white_sec">
        <div class="contact-header">
            <h1>Appointments</h1>
        </div>
        
        <table class="premium-table">
            <thead>
                <tr>
                    <th>Appointment ID</th>
                    <th>Client ID</th>
                    <th>Staff ID</th>
                    <th>Treatment ID</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        window.onload = async () => {
            const res = await fetch('/appointments'); 
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            
            data.forEach(appt => {
                const date = new Date(appt.appointment_date).toISOString().split('T')[0];
                tbody.innerHTML += `<tr>
                    <td>${appt.appointment_id}</td>
                    <td>${appt.client_id}</td>
                    <td>${appt.staff_id}</td>
                    <td>${appt.treatment_id}</td>
                    <td>${date}</td>
                    <td>${appt.appointment_time}</td>
                    <td>${appt.status}</td>
                </tr>`;
            });
        };
    </script>
</body>
</html>
