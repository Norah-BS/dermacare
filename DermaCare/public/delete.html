<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="appointments.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Delete</title>
</head>
<body>
    <nav class="navbar p2_sec">
        <h2 style="margin: 0;">DermaCare Appointments</h2>
        <ul class="primary-nav">
            <li><a href="main_appointments.html">View</a></li>
            <li><a href="add.html">Add</a></li>
            <li><a href="update.html">Update</a></li>
            <li><a href="delete.html" class="active">Delete</a></li>
        </ul>
    </nav>

    <div class="white_sec">
        <div class="contact-header"><h1 style="color: darkred;">Delete Record</h1></div>
        
        <div class="contact-form" style="margin-bottom: 20px; display: flex; flex-direction: row;">
            <input type="number" id="search_id" class="input-group-custom" placeholder="Enter Apptointment ID" style="flex: 1;" required>
            <button type="button" class="submit-btn" onclick="load()" style="border-radius: 10px;">Load</button>
        </div>

        <div id="details" class="contact-form" style="display: none; background: var(--S2); padding: 20px; border-radius: 10px;">
            <p><strong>Appointment ID:</strong> <span id="l_id"></span></p>
            <p><strong>Client ID:</strong> <span id="l_c"></span></p>
            <p><strong>Status:</strong> <span id="l_s"></span></p>
            <button onclick="del()" class="submit-btn" style="background: darkred; color: white; border-radius: 10px;">Confirm Delete</button>
        </div>
    </div>

    <script>
        let delId = null;

        async function load() {
            const searchId = document.getElementById('search_id').value;
            const res = await fetch('/appointments');
            const appt = (await res.json()).find(a => a.appointment_id == searchId);

            if (appt) {
                delId = appt.appointment_id;
                document.getElementById('l_id').innerText = appt.appointment_id;
                document.getElementById('l_c').innerText = appt.client_id;
                document.getElementById('l_s').innerText = appt.status;
                document.getElementById('details').style.display = 'block';
            } else alert("ID not found");
        }

        async function del() {
            if (!confirm("Are you sure?")) return;
            const res = await fetch(`/appointments/${delId}`, { method: 'DELETE' });
            alert(await res.text());
            if(res.status === 200) window.location.href = 'main_appointments.html';
        }
    </script>
</body>
</html>
