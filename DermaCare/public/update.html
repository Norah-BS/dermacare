<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/appointments.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Update</title>
</head>

<body>
    <nav class="navbar p2_sec">
        <h2 style="margin: 0;">DermaCare Appointments</h2>
        <ul class="primary-nav">
            <li><a href="main_appointments.html">View</a></li>
            <li><a href="add.html">Add</a></li>
            <li><a href="update.html" class="active">Update</a></li>
            <li><a href="delete.html">Delete</a></li>
        </ul>
    </nav>

    <div class="white_sec">
        <div class="contact-header">
            <h1>Update Appointment</h1>
        </div>

        <div class="contact-form" style="margin-bottom: 20px; display: flex; flex-direction: row;">
            <input type="number" id="search_id" class="input-group-custom" placeholder="Enter Apptointment ID"
                style="flex: 1;" required>
            <button type="button" class="submit-btn" onclick="load()" style="border-radius: 10px;">Load</button>
        </div>

        <form id="updateForm" class="contact-form" style="display: none;">
            <div class="input-group-custom"><input type="number" id="c_id" required></div>
            <div class="input-group-custom">
                <select id="s_id" required>
                    <option value="" disabled>Select Staff Member</option>
                    <option value="1">1 - Lina Ahmed (Dermatologist)</option>
                    <option value="2">2 - Maha Saleh (Laser Technician)</option>
                    <option value="3">3 - Noor Ali (Medical Aesthetician)</option>
                    <option value="4">4 - Reem Omar (Consultant)</option>
                    <option value="5">5 - Sara Khalid (Dermatologist)</option>
                    <option value="6">6 - Haifa Bader (Aesthetician)</option>
                </select>
            </div>

            <div class="input-group-custom">
                <select id="t_id" required>
                    <option value="" disabled>Select Treatment</option>
                    <option value="1">1 - Acne Treatment</option>
                    <option value="2">2 - Anti Aging Facial</option>
                    <option value="3">3 - Hydration Therapy</option>
                    <option value="4">4 - Pigmentation Treatment</option>
                    <option value="5">5 - Chemical Peel Treatment</option>
                    <option value="6">6 - Deep Cleansing Facial</option>
                    <option value="7">7 - Brightening Facial</option>
                </select>
            </div>
            <div class="input-group-custom"><input type="date" id="date" required></div>
            <div class="input-group-custom"><input type="time" id="time" required></div>
            <div class="input-group-custom">
                <select id="status" required>
                    <option value="scheduled">Scheduled</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <button type="submit" class="submit-btn" style="border-radius: 20px;">Update</button>
        </form>
    </div>

    <script>
        let currentId = null;

        async function load() {
            const searchId = document.getElementById('search_id').value;
            const res = await fetch('/appointments');
            const appt = (await res.json()).find(a => a.appointment_id == searchId);

            if (appt) {
                currentId = appt.appointment_id;
                document.getElementById('c_id').value = appt.client_id;
                document.getElementById('s_id').value = appt.staff_id;
                document.getElementById('t_id').value = appt.treatment_id;
                document.getElementById('date').value = new Date(appt.appointment_date).toISOString().split('T')[0];
                document.getElementById('time').value = appt.appointment_time;
                document.getElementById('status').value = appt.status;
                document.getElementById('updateForm').style.display = 'flex';
            } else alert("ID not found");
        }

        document.getElementById('updateForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                client_id: parseInt(document.getElementById('c_id').value),
                staff_id: parseInt(document.getElementById('s_id').value),
                treatment_id: parseInt(document.getElementById('t_id').value),
                appointment_date: document.getElementById('date').value,
                appointment_time: document.getElementById('time').value,
                status: document.getElementById('status').value
            };
            const res = await fetch(`/appointments/${currentId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            alert(await res.text());
        };
    </script>
</body>

</html>
