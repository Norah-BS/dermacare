    <div class="form_box">
        <h1>My Profile</h1>
        <p>Your personal information</p>

        <form id="profileForm">

            <label>First Name</label><br>
            <input id="firstName" type="text" disabled><br><br>

            <label>Last Name</label><br>
            <input id="lastName" type="text" disabled><br><br>

            <label>Date of Birth</label><br>
            <input id="dob" type="date" disabled><br><br>

            <label>Email</label><br>
            <input id="email" type="email" disabled><br><br>

            <label>Gender</label><br>
            <input id="gender" type="text" disabled><br><br>

            <label>Phone Number</label><br>
            <input id="phone" type="text" disabled><br><br>

            <label>Skin Type</label><br>
            <input id="skinType" type="text" disabled><br><br>

            <!-- Buttons -->
            <a id="editBtn" class="form_btn" style="cursor:pointer;">Edit Profile</a>
            <a id="saveBtn" class="form_btn" style="cursor:pointer; display:none;">Save Changes</a>

        </form>
    </div>

    <script>
        // ------------------------------
        // 1. Get logged-in client ID
        // ------------------------------
        const clientId = localStorage.getItem("client_id");

        if (!clientId) {
            alert("You must log in first");
            window.location.href = "login.html";
        }

        // ------------------------------
        // 2. Auto-fill profile from backend
        // ------------------------------
        function loadProfile() {
            fetch(`http://localhost:3000/client/${clientId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById("firstName").value = data.first_name;
                    document.getElementById("lastName").value = data.last_name;
                    document.getElementById("dob").value = data.dob;
                    document.getElementById("email").value = data.email;
                    document.getElementById("gender").value = data.gender;
                    document.getElementById("phone").value = data.phone;
                    document.getElementById("skinType").value = data.skin_type;
                })
                .catch(err => console.log("Error loading profile:", err));
        }

        loadProfile();

        // ------------------------------
        // 3. Enable edit mode
        // ------------------------------
        document.getElementById("editBtn").addEventListener("click", () => {
            document.querySelectorAll("input").forEach(input => input.disabled = false);

            document.getElementById("editBtn").style.display = "none";
            document.getElementById("saveBtn").style.display = "block";
        });

        // ------------------------------
        // 4. Save updated profile to backend
        // ------------------------------
        document.getElementById("saveBtn").addEventListener("click", () => {

            const updatedData = {
                first_name: document.getElementById("firstName").value,
                last_name: document.getElementById("lastName").value,
                dob: document.getElementById("dob").value,
                email: document.getElementById("email").value,
                gender: document.getElementById("gender").value,
                phone: document.getElementById("phone").value,
                skin_type: document.getElementById("skinType").value
            };

            fetch(`http://localhost:3000/client/${clientId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(updatedData)
            })
            .then(res => {
                if (!res.ok) {
                    alert("Update failed");
                    return;
                }
                alert("Profile updated successfully");

                // Disable fields again
                document.querySelectorAll("input").forEach(input => input.disabled = true);

                document.getElementById("saveBtn").style.display = "none";
                document.getElementById("editBtn").style.display = "block";
            })
            .catch(err => console.log("Error updating profile:", err));
        });
    </script>
